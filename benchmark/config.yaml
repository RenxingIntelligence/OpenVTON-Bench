# TryonBench configuration file

# ============================================================
# Data Paths
# ============================================================
data:
  # Path to the JSONL file containing test pairs
  test_jsonl: "./test_cluster.jsonl"

  # Directories containing generated images from different models
  # Multiple models can be configured for comparison
  generated_dirs:
    - name: "nanobanana"
      path: "./generated_images/nanobanana"
      description: "nanobanana"

  # Directory where evaluation results will be saved
  output_dir: "./eval_results"


# ============================================================
# Model Paths
# ============================================================
models:
  # DINOv3 configuration (used for feature extraction)
  dinov3:
    path: "./model/dinov3-vith16plus"
    image_size: 1024

  # SAM3 configuration (used for garment segmentation)
  sam:
    checkpoint: "./model/sam3/"

    # SAM3 segmentation parameters
    threshold: 0.5        # Detection confidence threshold (recommended range: 0.3–0.6)
    mask_threshold: 0.5   # Binary mask threshold
    default_prompt: "clothing"  # Fallback text prompt when no cluster label is available

    # Text prompt configuration
    cluster_label_mapping: "./simple_cluster_map.json"
    visual_buckets: "./visual_buckets.json"

  # Qwen-VL API configuration (used for VLM-based evaluation)
  qwen_vl:
    # API credentials
    api_key: "sk-xxxxxxxxxxxxxxxxx"  # Replace with your actual API key
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

    # Model configuration
    model_name: "qwen-vl-plus"       # Options: qwen-vl-plus, qwen-vl-max
    max_tokens: 2048                 # Maximum response tokens (1024 recommended to avoid truncation)

    # Parallel API requests
    max_workers: 10                  # Number of concurrent API workers


# ============================================================
# Evaluation Settings
# ============================================================
evaluation:
  # Enable or disable evaluation types
  enable_vlm: true        # Vision-Language Model based evaluation
  enable_garment: false   # Garment region based evaluation
  enable_all: false       # Full-image feature-based evaluation
  enable_pixel: false     # Pure pixel-space evaluation (no DINO features)

  # Pixel-based evaluation configuration
  pixel:
    enable_fid: false     # Enable FID computation (requires InceptionV3 features)

  # VLM evaluation dimensions (scored from 1–5)
  vlm_dimensions:
    - name: "background_consistency"
      display_name: "Background Consistency"
      description: "Consistency of background between generated and reference images"

    - name: "person_consistency"
      display_name: "Person Consistency"
      description: "Preservation of body pose and facial identity"

    - name: "garment_texture"
      display_name: "Garment Texture"
      description: "Accuracy of garment texture reproduction"

    - name: "garment_shape"
      display_name: "Garment Fit"
      description: "How well the garment shape aligns with the human body"

    - name: "overall_realism"
      display_name: "Overall Realism"
      description: "Perceptual realism and naturalness of the generated image"

  # Metrics used for Garment-based and All-based evaluation
  metrics:
    - "cosine_similarity"   # Feature cosine similarity
    - "mse"                 # Mean Squared Error
    - "ssim"                # Structural Similarity Index
    - "psnr"                # Peak Signal-to-Noise Ratio
    - "lpips"               # Learned Perceptual Image Patch Similarity

  # Mask erosion scales (in pixels) used during garment evaluation
  # Larger values focus more on the garment core region
  erosion_scales: [40, 80, 120]


# ============================================================
# GPU and Performance Configuration
# ============================================================
performance:
  # GPU device IDs (comma-separated)
  gpu_ids: "5"

  # DataLoader configuration
  batch_size: 32
  num_workers: 16

  # Feature caching
  use_cache: true
  cache_dir: "./.benchmark/.cache"

  # Parallel processing limits
  max_parallel_vlm: 4     # Maximum parallel VLM evaluation processes


# ============================================================
# Reporting and Visualization
# ============================================================
reporting:
  # Output report formats
  formats:
    - "json"   # Detailed machine-readable results
    - "txt"    # Human-readable summary
    - "html"   # Interactive HTML report

  # Visualization charts to generate
  visualizations:
    - "vlm_radar"           # Radar chart for VLM scores
    - "garment_heatmap"     # Heatmap of garment metrics
    - "all_comparison"      # Full-image metric comparison
    - "model_ranking"       # Model ranking chart
    - "metric_distribution" # Box plot of metric distributions

  # Plotting style
  plot_style: "seaborn"
  dpi: 300
  figsize: [12, 8]


# ============================================================
# Logging Configuration
# ============================================================
logging:
  level: "INFO"            # Options: DEBUG, INFO, WARNING, ERROR
  save_log: true
  log_file: "./benchmark/evaluation.log"


# ============================================================
# Miscellaneous Settings
# ============================================================
misc:
  # Random seed for reproducibility
  seed: 200

  # Save intermediate results during evaluation
  save_intermediate: true

  # Error handling strategy
  skip_on_error: true      # Skip problematic samples instead of stopping evaluation

  # Display progress bars
  show_progress: true